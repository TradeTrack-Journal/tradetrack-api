# Fly.io configuration for tradetrack-api (always-on real-time backend).
# Region fra (Frankfurt) — close to cTrader servers and the Vercel fra1 frontend.
app = 'tradetrack-api'
primary_region = 'fra'

[build]

[env]
  PORT = '8080'
  NODE_ENV = 'production'

[http_service]
  internal_port = 8080
  force_https = true
  # Always-on: never auto-stop, always keep one machine running (persistent cTrader sockets).
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    method = 'GET'
    path = '/health'
    timeout = '2s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
